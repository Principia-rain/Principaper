<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="基于 GitHub Pages 的个人论文站：站主上传论文，访客在线阅读。">
<title>论文站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='10' y='3' width='15' height='19' rx='2' fill='%23a9b7c6'/%3E%3Crect x='7' y='6' width='15' height='19' rx='2' fill='%237d93ad'/%3E%3Crect x='4' y='9' width='15' height='19' rx='2' fill='%232d5f8f'/%3E%3Cpath d='M7.5 14h8M7.5 17.5h8M7.5 21h5.5' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=2">
<link id="css-katex" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link id="css-hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<link id="css-hljs-dark" rel="stylesheet" disabled href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="config.js?v=2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script defer src="assets/core.js?v=2"></script>
<script defer src="assets/app.js?v=2"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="10" y="3" width="15" height="19" rx="2" fill="var(--logo-back, #a9b7c6)"/>
        <rect x="7"  y="6" width="15" height="19" rx="2" fill="var(--logo-mid, #7d93ad)"/>
        <rect x="4"  y="9" width="15" height="19" rx="2" fill="var(--accent)"/>
        <path d="M7.5 14h8M7.5 17.5h8M7.5 21h5.5" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span id="site-name">论文站</span>
    </a>
    <nav class="site-nav">
      <a href="#/" id="nav-list">论文</a>
      <a href="#/about" id="nav-about">关于</a>
      <button class="icon-btn" id="theme-toggle" title="切换深浅色主题" aria-label="切换深浅色主题">🌙</button>
      <button class="btn ghost small" id="admin-btn">站主登录</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ 列表视图 ============ -->
  <section id="view-list">
    <div class="list-col">
      <div class="list-tools">
        <div class="search-box">
          <span class="search-ico" aria-hidden="true">🔍</span>
          <input id="search" type="search" placeholder="搜索标题、摘要、作者或标签…" autocomplete="off">
        </div>
        <button class="icon-btn" id="refresh-btn" title="刷新列表（绕过缓存）">⟳</button>
      </div>
      <div id="list-count" class="list-count"></div>
      <div id="tag-bar" class="tag-bar"></div>
      <div id="list-status"></div>
      <div id="paper-list" class="paper-list"></div>
      <div id="list-more" class="list-more"></div>
    </div>
  </section>

  <!-- ============ 阅读视图（内容由 JS 填充） ============ -->
  <section id="view-read" hidden></section>

  <!-- ============ 关于视图（内容由 JS 填充） ============ -->
  <section id="view-about" hidden></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="footer-src" class="muted"></p>
    <p>由 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> 驱动的纯静态论文站 ·
       <a href="#" id="footer-admin">站主入口</a> · 内容版权归各论文作者所有</p>
  </div>
</footer>

<div id="toast-root"></div>
<div id="modal-root"></div>

<noscript>
  <div class="wrap noscript-note">本站需要启用 JavaScript 才能加载论文列表（纯静态站点，无任何跟踪脚本）。</div>
</noscript>

</body>
</html>
